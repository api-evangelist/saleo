note: >-
  Saleo publishes no OpenAPI and no error reference, so nothing here is derived
  from a specification or from documentation. Every entry is an error envelope
  observed on a live unauthenticated request on 2026-08-13. Two distinct envelopes
  coexist on the same host: the SCIM surface returns a conformant RFC 7644 error
  object, while the product API returns a bare {"message": "..."} object. Neither
  is RFC 9457 application/problem+json, and neither carries a machine-stable error
  code, so an agent has nothing but the HTTP status and an English string to
  branch on.
