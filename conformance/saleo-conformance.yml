generated: '2026-08-13'
method: searched
source: >-
  Saleo help centre, Okta Integration Network listing, saleo.io/platform/security/,
  trust.saleo.io, plus unauthenticated HTTP probes of api.platform.saleo.io
note: >-
  Saleo publishes no OpenAPI, so none of these assertions are derived from a
  specification. Standards marked conforms:true carry either a live protocol
  observation or a published provider claim, named in `evidence`.
standards:
- id: scim2
  name: SCIM 2.0 (RFC 7643 / RFC 7644)
  conforms: true
  evidence: >-
    GET https://api.platform.saleo.io/scim/v2/Users returned HTTP 401 with a
    conformant SCIM error envelope
    {"schemas":["urn:ietf:params:scim:api:messages:2.0:Error"],"status":"401",
    "detail":"UNAUTHORIZED"} on 2026-08-13. /scim/v2/ServiceProviderConfig,
    /ResourceTypes, /Schemas, /Users and /Groups all exist and all return the same
    envelope. Okta's Integration Network listing for Saleo declares SCIM with
    Create, Update, Deactivate and Group Push.
  observed: '2026-08-13'
  caveat: >-
    Feature conformance cannot be verified — ServiceProviderConfig is auth-gated,
    so the supported patch/bulk/filter/sort/etag capabilities are not readable.
- id: saml2
  name: SAML 2.0
  conforms: true
  evidence: >-
    Saleo publishes SAML-based SSO setup guides and Okta publishes a Saleo-specific
    SAML 2.0 configuration document at
    https://saml-doc.okta.com/SAML_Docs/How-to-Configure-SAML-2.0-for-Saleo.html
