name: Saleo
description: 'Saleo is an AI-powered demo experience platform for go-to-market teams,
  enabling sales and pre-sales engineers to run high-stakes live demos inside their
  native product, build self-serve interactive product tours, and deliver autonomous
  AI-driven demos around the clock. Its products include Live (real demos backed by
  AI-generated demo data), Demo Agent (autonomous AI discovery agents), and Capture
  (interactive product tours). Saleo serves enterprise customers including SAP, Salesforce,
  6sense, Seismic, and SailPoint, and is backed by Emergence Capital. No public developer
  API surface was found during enrichment; this profile tracks the company for the
  API Evangelist network.'
