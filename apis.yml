name: Saleo
description: 'Saleo is an AI-native demo experience platform for go-to-market teams,
  enabling sales and pre-sales engineers to run high-stakes live demos inside their
  native product, build self-serve interactive product tours, and deliver autonomous
  AI-driven demos around the clock. Its products include Live (real demos backed by
  AI-generated demo data), AI Demo Agent (autonomous multi-lingual discovery and demo
  agents), Data Creation Agent, Capture (interactive product tours and embeddable sandboxes),
  and a Partner Portal for resellers. Saleo serves enterprise customers including SAP,
  Salesforce, 6sense, Seismic, and SailPoint, and is backed by Emergence Capital. Its
  only standards-based, externally documented API is a SCIM 2.0 user and group provisioning
  endpoint used by the Saleo app in the Okta Integration Network; the product API that
  backs the Saleo Portal, Chrome extension and tour viewer is customer-authenticated
  and undocumented.'
